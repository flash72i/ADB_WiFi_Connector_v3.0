<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Tray</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: transparent; overflow: hidden; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; user-select: none; }
  .menu {
    margin: 10px;
    background: rgba(18, 24, 30, .92);
    backdrop-filter: blur(16px) saturate(1.2);
    border: 1px solid rgba(255,255,255,.10);
    border-radius: 12px;
    box-shadow: 0 14px 34px rgba(0,0,0,.5);
    padding: 6px;
    color: #e8edf2;
  }
  .mi {
    display: flex; align-items: center; gap: 10px; width: 100%;
    padding: 9px 12px; border: 0; background: transparent; border-radius: 8px;
    color: #e8edf2; font-size: 13px; cursor: pointer; text-align: left;
  }
  .mi:hover { background: rgba(99,102,241,.16); }
  .mi .ic { width: 18px; text-align: center; color: #a5b4fc; font-size: 14px; }
  .sep { height: 1px; background: rgba(255,255,255,.09); margin: 5px 8px; }
  .mi.danger { color: #f28b82; }
  .mi.danger:hover { background: rgba(242,139,130,.14); }
  .tray-device {
    padding: 4px 12px 8px 40px;
    color: #a9b6c6;
    font-size: 11px;
    line-height: 1.35;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .tray-device b { color: #e8edf2; font-weight: 600; }
  .tray-auto {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 12px 8px 12px;
    color: #cbd5e1; font-size: 12px; cursor: pointer;
  }
  .tray-auto input { accent-color: #6366f1; }
</style>
</head>
<body>
<div class="menu">
  <button class="mi" id="m-show"><span class="ic">&#9632;</span>Показать окно</button>
  <div class="tray-device" id="tray-device">Проверяю…</div>
  <label class="tray-auto"><input type="checkbox" id="tray-auto"><span>Автоподключение</span></label>
  <div class="sep"></div>
  <button class="mi" id="m-scan"><span class="ic">&#8635;</span>Сканировать сеть</button>
  <button class="mi" id="m-sett"><span class="ic">&#9881;</span>Настройки</button>
  <div class="sep"></div>
  <button class="mi danger" id="m-exit"><span class="ic">&#10005;</span>Выход</button>
</div>
<script>
  const a = window.api;
  const act = (id, msg) => document.getElementById(id).addEventListener('click', () => a.trayMenu(msg));
  act('m-show', 'show');
  act('m-scan', 'scan');
  act('m-sett', 'sett');
  act('m-exit', 'exit');

  async function refresh() {
    try {
      const s = await a.trayState();
      if (!s || !s.ok) return;
      document.getElementById('tray-auto').checked = !!s.autoconnect;
      const box = document.getElementById('tray-device');
      if (!s.devices || !s.devices.length) {
        box.textContent = 'Не подключено';
      } else if (s.devices.length === 1) {
        box.textContent = s.devices[0].model;
      } else {
        box.textContent = 'Устройств: ' + s.devices.length;
      }
    } catch (e) {}
  }
  document.getElementById('tray-auto').addEventListener('change', async (event) => {
    await a.traySetAutoconnect(!!event.target.checked);
  });
  window.addEventListener('focus', refresh);
  refresh();
</script>
</body>
</html>
