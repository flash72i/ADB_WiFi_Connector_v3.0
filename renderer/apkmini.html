<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; script-src 'self'">
<title>Установка APK — ADB Wi-Fi Коннектор</title>
<link rel="stylesheet" href="styles.css">
</head>
<body data-theme="dark" class="mini-win">

<!-- Заголовок: перетаскивание окна за эту полосу (frameless-окно) -->
<header id="mini-titlebar">
  <div class="tb-left">
    <img src="../assets/icon.png" alt="" class="tb-icon">
    <span class="tb-title">Установка APK</span>
    <span class="tb-badge">быстрое окно</span>
  </div>
  <div class="tb-buttons">
    <button class="tb-btn tb-close" id="mini-close" data-tip="Закрыть">&#x2715;</button>
  </div>
</header>

<div id="mini-body">
  <div class="mini-head">
    <img id="mini-icon" src="" alt="">
    <div class="grow2" style="min-width:0">
      <div class="mini-title" id="mini-title">Читаю файл…</div>
      <div class="mini-sub" id="mini-sub"></div>
    </div>
  </div>

  <div class="muted small mono" id="mini-file" style="word-break:break-all;margin-bottom:10px"></div>

  <div id="mini-meta" class="muted small" style="line-height:1.75"></div>

  <!-- автопроверка «установлено ли приложение на телефоне» -->
  <style>
    .inst-check { margin-top: 8px; padding: 7px 10px; border-radius: 8px; font-size: 12px; font-weight: 600; }
    .inst-check.inst-ok { color: #69d98d; background: rgba(105,217,141,.12); border: 1px solid rgba(105,217,141,.35); }
    .inst-check.inst-none { color: #f2b84b; background: rgba(242,184,75,.12); border: 1px solid rgba(242,184,75,.35); }
  </style>

  <label class="field" style="margin-top:12px">
    <span>Установить на устройство</span>
    <select id="mini-target" class="select" autocomplete="off"></select>
  </label>

  <!-- ЯВНЫЙ статус подключения + поиск телефона по сети прямо из этого окна -->
  <div class="row" style="margin-top:10px">
    <span class="dev-status" id="mini-devstatus"><span class="dot off"></span><span id="mini-devtext">Проверяю устройства…</span></span>
    <span class="grow"></span>
    <button class="btn btn-text btn-sm" id="mini-find" data-tip="Найти телефон в сети (mDNS + сканирование подсети) и подключиться в один клик">Найти устройство</button>
  </div>
  <div id="mini-find-results" class="list" style="margin-top:8px;max-height:150px;overflow-y:auto"></div>

  <div class="row" style="margin-top:10px;align-items:center">
    <button class="btn btn-tonal" id="mini-connect" data-tip="Подключить это устройство (IP:порт), не открывая основную программу">Подключить…</button>
    <button class="btn btn-text" id="mini-refresh" data-tip="Обновить список устройств">&#8635;</button>
    <span class="grow"></span>
    <button class="btn btn-filled" id="mini-install" disabled>Установить</button>
  </div>
  <div class="row" id="mini-conn-row" style="margin-top:8px">
    <input type="text" id="mini-conn-ip" class="grow" placeholder="IP:порт с экрана «Беспроводная отладка» (например 192.0.2.42:5555)" spellcheck="false">
    <button class="btn btn-tonal btn-sm" id="mini-conn-go">Подключить</button>
  </div>

  <div class="mini-progress hidden" id="mini-progress"><div class="bar" id="mini-bar"></div></div>
  <div class="muted small" id="mini-status" style="margin-top:8px;min-height:18px"></div>
  <div id="mini-error" class="mini-err hidden"></div>
  <!-- открыть основную программу из окошка установщика -->
  <div class="row" style="margin-top:14px;justify-content:center">
    <button class="btn btn-text btn-sm" id="mini-open-main" data-tip="Открыть основную программу (подключение, файлы, приложения)">Открыть программу</button>
  </div>
</div>

<div id="snackbar" class="snackbar hidden"></div>
<script src="apkmini.js"></script>
</body>
</html>
